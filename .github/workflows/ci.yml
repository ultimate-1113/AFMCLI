name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: "1.89.0"
          - os: macos-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Select Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
          rustup override set "${{ matrix.toolchain }}"
      - name: Check the CLI and library
        run: cargo test --locked --all-targets
      - name: Format and lint
        if: matrix.toolchain == 'stable'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Replay synthetic results and check the publication
        run: |
          python3 -B tools/verify_results.py
          cargo build --locked --bin afmcli
          git worktree add --detach "$RUNNER_TEMP/afmcli-v0.1.1" 35605d85b097bd4ffdcd3e002ad7567053ca5789
          python3 -B "$RUNNER_TEMP/afmcli-v0.1.1/eval/row_guard/run.py" replay --output eval/row_guard/results.jsonl --binary target/debug/afmcli
          python3 -B eval/procedures/study.py verify
          python3 -B eval/procedures/regression.py verify
          python3 -B tools/test_png_audit.py
          python3 -B tools/privacy_audit.py --tracked
