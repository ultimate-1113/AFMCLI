name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: "1.89.0"
          - os: macos-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Select Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
          rustup override set "${{ matrix.toolchain }}"
      - name: Check the CLI and library
        run: |
          cargo test --locked --all-targets
          cargo test --locked --all-targets --features experimental-index
      - name: Format and lint
        if: matrix.toolchain == 'stable'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features experimental-index -- -D warnings
      - name: Replay synthetic results and check the publication
        run: |
          python3 -B tools/verify_results.py
          cargo build --locked --bin afmcli
          git worktree add --detach "$RUNNER_TEMP/afmcli-v0.1.1" 35605d85b097bd4ffdcd3e002ad7567053ca5789
          python3 -B "$RUNNER_TEMP/afmcli-v0.1.1/eval/row_guard/run.py" replay --output eval/row_guard/results.jsonl --binary target/debug/afmcli
          git worktree add --detach "$RUNNER_TEMP/afmcli-v0.2.0" 6f771a531949497c80f89db1231d30afcf6bb7d3
          python3 -B "$RUNNER_TEMP/afmcli-v0.2.0/eval/procedures/study.py" verify --results eval/procedures
          python3 -B eval/procedures/regression.py verify
          git worktree add --detach "$RUNNER_TEMP/afmcli-compact-pilot" f440105c11ed964033d73185f8c0dc7bd4563cfc
          python3 -B "$RUNNER_TEMP/afmcli-compact-pilot/eval/context/bench.py" verify --results eval/context/pilot.jsonl
          python3 -B eval/context/bench.py verify --results eval/context/second-pass.jsonl
          python3 -B eval/context/bench.py verify
          python3 -B eval/repeats/bench.py verify
          python3 -B eval/repeats/check_short.py verify
          python3 -B eval/repeats/verifier_probe.py verify
          python3 -B eval/grounding/study.py verify
          python3 -B eval/repeats/check_short.py verify --results eval/grounding/short.jsonl
          python3 -B eval/repeats/check_short.py verify --route records --results eval/grounding/short-records.jsonl
          python3 -B eval/repeats/check_short.py verify --route review --results eval/grounding/short-review.jsonl
          python3 -B eval/grounding/routes.py verify
          python3 -B eval/moe/general_checks.py
          python3 -B eval/moe/special_check.py
          python3 -B eval/moe/study.py verify
          python3 -B eval/moe/study.py report > "$RUNNER_TEMP/afm-moe-summary.json"
          cmp "$RUNNER_TEMP/afm-moe-summary.json" eval/moe/results/summary.json
          python3 -B eval/moe/regression.py verify
          python3 -B eval/repeats/check_short.py verify --route records --results eval/moe/results/regression-short.jsonl
          python3 -B eval/index_status/test_fixtures.py
          python3 -B eval/index_status/test_targeted.py
          python3 -B eval/index_status/bench.py verify --split dev
          python3 -B eval/index_status/bench.py verify --split test
          python3 -B eval/index_status/bench.py report --split test > "$RUNNER_TEMP/index-report.json"
          cmp "$RUNNER_TEMP/index-report.json" eval/index_status/results/summary.json
          python3 -B eval/index_status/targeted_bench.py verify
          python3 -B eval/index_status/regressions.py verify
          python3 -B -m unittest discover -s eval/calculator/native
          python3 -B eval/calculator/verify.py
          python3 -B eval/calculator/native/words.py verify
          python3 -B eval/calculator/native/sufficiency.py verify --cases eval/calculator/native/sufficiency_cases.json --out eval/calculator/native-sufficiency.jsonl
          python3 -B eval/calculator/check_math.py --binary target/debug/afmcli
          python3 -B tools/test_png_audit.py
          python3 -B tools/privacy_audit.py --tracked
